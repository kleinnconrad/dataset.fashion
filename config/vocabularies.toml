# Fixed lists of values (vocabularies) of the extracted attributes, schema 2.x.
#
# The lists are slowly changing dimensions: values are added and retired over time, and the
# history stays in this file. Gemini is offered the values without `retired`; records keep the
# value that was offered when they were extracted. src/schema.py builds the response schema from
# this file, so a change here changes the extraction hash of the following records.
#
# Rules:
# - A value is never renamed and never reused for another meaning. A changed meaning needs a new value.
# - added:   first day on which the value is offered to Gemini (records of schema 2.0 start on 2026-10-11).
# - retired: first day on which the value is no longer offered. The entry stays in the list.
# - parent:  value of the same list that a new value refines (e.g. after splitting a value), so that
#            series can be summed up to the earlier values.
# - category (garment_type only): the garment category of the type, a value of garment_category.
# - Every change is listed with its date in the change log of the lists in README.md.

# Used by: category of garments (derived from garment_type)
[garment_category]
values = [
    { value = "Top", added = 2026-10-11 },
    { value = "Bottom", added = 2026-10-11 },
    { value = "Dress/One-piece", added = 2026-10-11 },
    { value = "Outerwear", added = 2026-10-11 },
    { value = "Footwear", added = 2026-10-11 },
    { value = "Bag", added = 2026-10-11 },
    { value = "Headwear", added = 2026-10-11 },
